[build-system]
requires = [
    "setuptools",
    "setuptools_scm",
]
build-backend = "setuptools.build_meta"

# where your source lies if you followed src layout
[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools]
include-package-data = false # force explicit declaration of data (disable automatic inclusion)

# enable dynamic version based on git tags
[tool.setuptools_scm]

[project]
name = "openalea.granap"
authors = [
  { name = "Adrien Heymans", email = "adrien.heymans@uclouvain.be" },
]
description = "Todo"
readme = "README.md"
license = "CECILL-C"
license-files = ["LICEN[CS]E*"]
# geos 3.14 / numpy 2.x are not available for python < 3.11
requires-python = ">=3.11"
dynamic = ["version"]
classifiers = [
  "Development Status :: 1 - Planning",
  "Intended Audience :: Science/Research",
  "Intended Audience :: Developers",
  #"License :: OSI Approved :: CeCILL-C License",
  "Operating System :: OS Independent",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering",
  "Framework :: PEPA",
]

# you can list here all dependencies that are pip-instalable, and that have a name identical to the one used by conda (to allow reuse of this list in meta.yaml)
# If conda name is different, please do not declare the pip name, and declare conda name in the next section
dependencies = []

# section specific to conda-only distributed package (not used by pip yet)
[tool.conda.environment]

# These bounds are load-bearing, not hygiene.  test/test_vascular_regression.py
# pins an exact cell-type census, and that census is decided by the geometry
# stack: the `air space` cells are the connected components of a GEOS boolean
# difference (Organ._apply_intercellular), filtered by an absolute area cut, so
# a different GEOS build shifts the census by a cell or two and the golden test
# fails on one OS but not another.
#
# Pinning `shapely` alone does NOT pin GEOS: a single shapely version ships ~20
# conda builds linked against different GEOS releases, and the solver is free to
# pick a different one per OS.  Hence the explicit `geos` pin.  As it happens
# shapely 2.1.2 only has geos-3.14 builds (2.1.1 has both 3.13 and 3.14 builds,
# which is exactly the trap), but the pin makes that explicit rather than lucky.
#
# geos 3.14 requires python >= 3.11: the py3.10 geospatial stack (pyogrio/proj)
# was never rebuilt against it, so the CI matrix drops 3.10.  See
# .github/workflows/conda-package-build.yml.
dependencies = [
    "geos ==3.14.1",         # geometry engine — decides the golden census
    "shapely ==2.1.2",       # GEOS bindings
    "opencv ==4.13.0",       # cv2.fitEllipse in geometry_collection
    "scipy >=1.13,<1.18",    # vendored Qhull — Voronoi / Delaunay / cKDTree
    "numpy >=1.26,<3",
    "geopandas >=1.0,<2",
    "pandas >=2.0,<4",
    "matplotlib >=3.8,<4",
    "networkx >=3.1,<4",     # network_base
    "munkres >=1.1,<2",      # shapes
    "pydantic >=2.7,<3",
    "roifile >=2023.8",      # roi_organ
    "lxml >=5,<7",           # no usage in src/ — kept for compatibility
    "scikit-learn >=1.3,<2", # no usage in src/ — kept for compatibility
]

[project.optional-dependencies]
test = [
  "pytest",
  "nbmake"
]
dev = [
  "pytest >=6",
  "pytest-cov >=3",
]
doc = [
  "pydata-sphinx-theme",
  "myst-parser",
  "sphinx-favicon",
  "ipykernel",
  "sphinx-copybutton",
  "ipython_genutils",
  "nbsphinx",
  "pyan3"
]

[project.urls]
Repository = "https://github.com/openalea-incubator/GRANAP-dev"

[project.entry-points."wralea"]
"granap" = "granap_wralea"
