name: granap
channels:
  - openalea3            # openalea.mtg / plantgl (metafspm)
  - conda-forge
  - nodefaults           # ignore the defaults channels added by ~/miniconda3/.condarc
# flexible: strict priority doubled the solve time (12 min vs 5 min) with no different outcome
channel_priority: flexible

# Keep the geometry stack identical to the pins in pyproject.toml
# ([tool.conda.environment].dependencies) — the golden regression suite
# (test/test_vascular_regression.py) pins an exact cell census, and a different
# GEOS build shifts it. A dev env that drifts from CI will disagree with CI.
# Only the pins that matter are kept; the rest is left to the solver.
dependencies:
  - python           # openalea.plantgl (via openalea.mtg) has no 3.14 build
  - pip
  - geos =3.14.1          # geometry engine — decides the golden census
  - shapely =2.1.2        # GEOS bindings
  - scipy >=1.13,<1.18    # vendored Qhull — Voronoi / Delaunay / cKDTree
  - numpy
  - geopandas
  - pandas
  - matplotlib
  - networkx
  - munkres
  - pydantic >=2.7
  - roifile
  - ipykernel             # notebooks
  # metafspm (the MPG every section is generated into, src/openalea/granap/metafspm)
  - openalea.mtg
  - numba
  - pyyaml
  - pytest
  - pip:
    # cv2.fitEllipse in geometry_collection. From pip rather than conda: every conda opencv 4.13 build needs
    # icu 78, while openalea.plantgl (required by openalea.mtg) is built on Qt 5 / icu 75, so the solve never ends.
    - "opencv-python-headless==4.13.0.*"
    - "-e ..[doc]"
    - "-e ../../metafspm"
