name: granap
channels:
  - conda-forge
channel_priority: strict

# Keep the geometry stack identical to the pins in pyproject.toml
# ([tool.conda.environment].dependencies) — the golden regression suite
# (test/test_vascular_regression.py) pins an exact cell census, and a different
# GEOS build shifts it. A dev env that drifts from CI will disagree with CI.
dependencies:
  # CI builds 3.11-3.13; dev may run ahead — the census is identical on 3.13
  # and 3.14, the geometry pins below are what actually matter.
  - python >=3.11
  - pip
  - git
  - geos =3.14.1          # geometry engine — decides the golden census
  - shapely =2.1.2        # GEOS bindings
  - opencv =4.13.0        # cv2.fitEllipse in geometry_collection
  - scipy >=1.13,<1.18    # vendored Qhull — Voronoi / Delaunay / cKDTree
  - numpy >=1.26,<3
  - geopandas >=1.0,<2
  - pandas >=2.0,<4
  - matplotlib >=3.8,<4
  - networkx >=3.1,<4
  - munkres >=1.1,<2
  - pydantic >=2.7,<3
  - roifile >=2023.8
  - lxml >=5,<7
  - scikit-learn >=1.3,<2
  - ipykernel
  - pip:
    - "-e ..[doc]"
