name: OpenAlea CI

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      check_before_tag:
        description: "Run OpenAlea CI pre-tag build"
        required: false
        default: "true"
        type: boolean

run-name: >
  ${{ github.event_name == 'workflow_dispatch' && 'OpenAlea CI pre-tag build' || 'OpenAlea CI' }}

jobs:
  build:
    uses: openalea/action-build-publish-anaconda/.github/workflows/openalea_ci.yml@main
    with:
      # Default is [10, 11, 12, 13].  3.10 is dropped: geos 3.14 — pinned in
      # pyproject.toml because the golden regression test's cell census depends
      # on the GEOS build — has no py3.10 geospatial stack (pyogrio/proj were
      # never rebuilt against it), so a py3.10 job would resolve an older GEOS
      # and drift from the golden values.
      python-minor-version: '[11, 12, 13]'
    secrets:
      anaconda_token: ${{ secrets.ANACONDA_TOKEN }}
